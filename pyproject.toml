[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ecoacoustic-windowing"
version = "0.1.0"
description = "Unsupervised time-frequency sound-event proposals using fine-band drift grouping"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Thomas Napier"}]
dependencies = [
  "numpy>=1.24,<3", "scipy>=1.10,<2", "pandas>=2,<4",
  "librosa>=0.10.2,<1.1", "matplotlib>=3.7,<4",
  "scikit-learn>=1.3,<2", "soundfile>=0.12,<1"
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
dev = ["pytest>=8,<10", "nbformat>=5,<6"]

[project.scripts]
acoustic-windowing = "adaptive_windowing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_windowing = ["defaults.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
